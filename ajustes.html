<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tique - Ajustes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container dashboard-layout">
        
        <div class="scroll-area relative-area">
            
            <!-- Cabeçalho -->
            <header class="cobrancas-header">
                <h2>Ajustes</h2>
            </header>

            <!-- Card de Perfil Dinâmico -->
            <div class="profile-card" style="display: flex; align-items: center; gap: 16px; background: #ffffff; padding: 20px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
                <!-- Avatar com ID para receber a inicial -->
                <div id="perfilAvatar" style="width: 48px; height: 48px; background-color: #0f172a; color: #ffffff; font-weight: 700; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                    P
                </div>
                <div>
                    <!-- Nome com ID -->
                    <h4 id="perfilNome" style="font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 2px;">Carregando...</h4>
                    <!-- E-mail com ID -->
                    <p id="perfilEmail" style="font-size: 13px; color: #64748b; margin: 0;">carregando...</p>
                </div>
            </div>

            <!-- Grupo de Preferências -->
            <div class="settings-group">
                <h4 class="settings-title">PREFERÊNCIAS</h4>
                
                <!-- Envolvido com a tag <a> para direcionar para minha-conta.html -->
                <a href="minha-conta.html" style="text-decoration: none; color: inherit; display: block;">
                    <div class="settings-item" style="cursor: pointer;">
                        <div class="settings-item-left">
                            <div class="settings-icon bg-blue">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <span>Minha Conta</span>
                        </div>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </a>
                
                <!-- Opção para Editar Mensagem de Cobrança -->
                <a href="mensagem.html" style="text-decoration: none; color: inherit; display: block;">
                    <div class="settings-item" style="cursor: pointer;">
                        <div class="settings-item-left">
                            <!-- Troquei a cor para bg-green e o ícone para um balão de mensagem -->
                            <div class="settings-icon bg-green" style="background-color: #d1fae5; color: #047857;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                                </svg>
                            </div>
                            <span>Mensagem de Cobrança</span>
                        </div>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </a>

            </div>

            <!-- Grupo do Sistema -->
            <div class="settings-group">
                <h4 class="settings-title">SISTEMA</h4>
                
                <!-- Opção Sobre o App -->
                <a href="sobre.html" style="text-decoration: none; color: inherit; display: block;">
                    <div class="settings-item" style="cursor: pointer;">
                        <div class="settings-item-left">
                            <div class="settings-icon bg-gray-av">
                                <!-- Ícone de Informação (i) no lugar da interrogação -->
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <line x1="12" y1="16" x2="12" y2="12"></line>
                                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                </svg>
                            </div>
                            <span>Sobre o App</span>
                        </div>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </div>
                </a>
                
                <!-- Botão de Sair com a função sairDoApp() -->
                <div class="settings-item" onclick="sairDoApp()" style="cursor: pointer;">
                    <div class="settings-item-left">
                        <div class="settings-icon bg-red">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        </div>
                        <span style="color: #ef4444;">Sair da conta</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Menu de Navegação Inferior -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Início</span>
            </a>
            <a href="cobrancas.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Cobranças</span>
            </a>
            <a href="ajustes.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Ajustes</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
