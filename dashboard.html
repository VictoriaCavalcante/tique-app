<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tique - Visão Geral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container dashboard-layout">
        
        <!-- Área rolável da tela -->
        <div class="scroll-area">
            
            <!-- Cabeçalho -->
            <header class="dash-header">
                <span class="greeting">Bom dia</span>
                <h2>Visão Geral</h2>
            </header>

            <!-- Filtros -->
            <div class="filters">
                <button class="filter-pill active">Este mês</button>
                <button class="filter-pill">Geral</button>
                <button class="filter-pill">Mês passado</button>
            </div>

            <!-- Cards de Resumo -->
            <div class="summary-cards">
                <div class="card card-green">
                    <div class="card-icon bg-green-light">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
                    </div>
                    <span class="card-label">RECEBIDO</span>
                    <h3 class="card-value">R$ 9.140</h3>
                </div>
                
                <div class="card card-orange">
                    <div class="card-icon bg-orange-light">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <span class="card-label">A RECEBER</span>
                    <h3 class="card-value">R$ 8.400</h3>
                </div>
            </div>

            <!-- Saúde Financeira -->
            <div class="health-card">
                <div class="health-header">
                    <div>
                        <h4>Saúde Financeira</h4>
                        <span class="health-subtitle">Recebido vs. A Receber</span>
                    </div>
                    <span class="health-percent">52%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" style="width: 52%;"></div>
                </div>
                <div class="health-legend">
                    <span><span class="dot dot-green"></span> Recebido</span>
                    <span><span class="dot dot-orange"></span> A Receber</span>
                </div>
            </div>

            <!-- Top Categorias -->
            <h3 class="section-title">Top Categorias</h3>
            <div class="category-list">
                
                <div class="category-item">
                    <div class="cat-icon bg-green-light">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                    </div>
                    <div class="cat-info">
                        <div class="cat-header">
                            <span class="cat-name">Consultoria</span>
                            <span class="cat-value">R$ 4.200</span>
                        </div>
                        <div class="cat-track"><div class="cat-fill bg-green" style="width: 70%;"></div></div>
                    </div>
                </div>

                <div class="category-item">
                    <div class="cat-icon bg-purple-light">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    </div>
                    <div class="cat-info">
                        <div class="cat-header">
                            <span class="cat-name">Design</span>
                            <span class="cat-value">R$ 2.800</span>
                        </div>
                        <div class="cat-track"><div class="cat-fill bg-purple" style="width: 45%;"></div></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Menu de Navegação Inferior -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Início</span>
            </a>
            <a href="cobrancas.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Cobranças</span>
            </a>
            <a href="#" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Ajustes</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
