<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tique - Cobranças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container dashboard-layout">
        
        <div class="scroll-area">
            
            <!-- Cabeçalho com botão de Adicionar -->
            <header class="dash-header flex-header">
                <h2>Cobranças</h2>
                <button class="btn-icon" onclick="alert('Logo vamos criar a tela de cadastro!')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </header>

            <!-- Barra de Busca -->
            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" placeholder="Buscar cliente...">
            </div>

            <!-- Lista de Clientes (Mockados para o visual) -->
            <div class="clientes-list" id="listaClientes">
                
                <!-- Cliente 1 -->
                <div class="cliente-card">
                    <div class="cliente-header">
                        <div>
                            <h4 class="cliente-nome">Ana Souza</h4>
                            <span class="cliente-servico">Consultoria</span>
                        </div>
                        <div class="text-right">
                            <h4 class="cliente-valor">R$ 1.250,00</h4>
                            <span class="status-badge status-vencer">A vencer</span>
                        </div>
                    </div>
                    <div class="cliente-actions">
                        <!-- O link do WhatsApp mágico -->
                        <a href="https://wa.me/5568999999999?text=Olá%20Ana,%20tudo%20bem?%20O%20vencimento%20da%20sua%20fatura%20de%20R$%201.250,00%20está%20próximo." target="_blank" class="btn-whatsapp">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            Cobrar pelo WhatsApp
                        </a>
                    </div>
                </div>

                <!-- Cliente 2 -->
                <div class="cliente-card">
                    <div class="cliente-header">
                        <div>
                            <h4 class="cliente-nome">Carlos Lima</h4>
                            <span class="cliente-servico">Design</span>
                        </div>
                        <div class="text-right">
                            <h4 class="cliente-valor">R$ 3.800,00</h4>
                            <span class="status-badge status-atrasado">Atrasado</span>
                        </div>
                    </div>
                    <div class="cliente-actions">
                        <a href="https://wa.me/5568999999999?text=Olá%20Carlos,%20notamos%20um%20atraso%20no%20pagamento..." target="_blank" class="btn-whatsapp">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            Cobrar pelo WhatsApp
                        </a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Menu de Navegação Inferior -->
        <nav class="bottom-nav">
            <!-- Link para voltar ao Dashboard -->
            <a href="dashboard.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Início</span>
            </a>
            <a href="cobrancas.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Cobranças</span>
            </a>
            <a href="#" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Ajustes</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
