<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tique - Cobranças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="inicializarCobrancas()">

    <div class="container dashboard-layout">
        
        <div class="scroll-area relative-area">
            
            <!-- Cabeçalho Cobranças Alinhado e com ID para a saudação -->
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <span class="greeting" id="textoSaudacao" style="display: block;">Bom dia</span>
                    <h2 style="margin-top: 4px; margin-bottom: 0;">Cobranças</h2>
                </div>
                
                <button class="btn-icon" onclick="sairDoApp()" title="Sair da conta" style="flex-shrink: 0; display: flex; justify-content: center; align-items: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </header>

            <!-- Card Escuro de Resumo -->
            <div class="summary-dark-card">
                <div class="summary-left">
                    <span class="summary-label">TOTAL EM ABERTO</span>
                    <h3 class="summary-value" id="totalAberto">R$ 0,00</h3>
                </div>
                <div class="summary-right">
                    <span class="summary-label">ATRASADOS</span>
                    <h3 class="summary-highlight" id="totalAtrasados">0</h3>
                </div>
                <div class="circle-decoration"></div>
            </div>

            <!-- Filtros (Pills) -->
            <div class="filters cobrancas-filters">
                <button class="filter-pill active" onclick="filtrarCobrancas('Todos', this)">Todos</button>
                <button class="filter-pill" onclick="filtrarCobrancas('ATRASADO', this)">Atrasados</button>
                <button class="filter-pill" onclick="filtrarCobrancas('A Vencer', this)">A Vencer</button>
            </div>

            <!-- Lista de Clientes -->
            <div class="clientes-list" id="listaClientes">
                <!-- Os cards vão entrar aqui dinamicamente -->
            </div>

            <!-- Botão Flutuante (FAB) de Nova Cobrança -->
            <button class="fab-button" onclick="window.location.href='novo.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </div>

        <!-- Menu de Navegação Inferior -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Início</span>
            </a>
            <a href="cobrancas.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span>Cobranças</span>
            </a>
            <a href="ajustes.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Ajustes</span>
            </a>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
