<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tique - Minha Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="carregarDadosEdicao()">
    <div class="container login-layout">
        
        <div class="top-content" style="margin-top: 40px; display: flex; flex-direction: column; align-items: flex-start; text-align: left; width: 100%;">
            <button class="btn-icon" onclick="window.location.href='ajustes.html'" style="margin-bottom: 24px; background: transparent; border: 1px solid #e2e8f0; width: 44px; height: 44px; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            
            <h1 class="logo-text" style="font-size: 28px; margin-bottom: 8px;">Minha Conta</h1>
            <p class="subtitle" style="margin: 0; margin-bottom: 32px;">Atualize suas informações pessoais abaixo.</p>
        </div>

        <div class="middle-content">
            <form id="editarForm" onsubmit="salvarAlteracoesConta(event)">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="editNome" placeholder="Seu nome" required>
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="editEmail" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="editSenha" placeholder="Digite nova senha ou mantenha" required>
                </div>

                <button type="submit" class="btn-login" style="margin-top: 16px; background-color: #10b981;">Salvar Alterações</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
